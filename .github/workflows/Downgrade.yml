name: Downgrade
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Fix dependencies for julia-1.13 # Temporary fix: this is needed for Unitful to downgrade to a version that works with julia-1.13
        run: julia --project=. -e 'using Pkg; Pkg.add(name = "Unitful", version = "1.25.1"); Pkg.compat("Unitful", "1.25.1")'
        shell: bash
        if: matrix.version == '1'
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          julia_version: ${{ matrix.version }}
          mode: deps
          skip: Pkg,TOML
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1